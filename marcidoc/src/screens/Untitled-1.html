<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>MARCI-DOC</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;width:100%;}
body{font-family:'DM Sans',sans-serif;background:#F3F4F6;overflow:hidden;}
:root{
  --p:#7C3AED;--pl:#EDE9FE;--pd:#1E1B4B;
  --r:#DC2626;--rl:#FEF2F2;
  --g:#059669;--gl:#ECFDF5;
  --w:#D97706;--wl:#FEF3C7;--wd:#92400E;
  --gr1:#F9FAFB;--gr2:#F3F4F6;--gr3:#E5E7EB;
  --gr4:#9CA3AF;--gr5:#6B7280;--gr6:#1F2937;
  --wh:#fff;--gn:#065F46;
}
#root{display:flex;flex-direction:column;height:100%;}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden;}
.screen.on{display:flex;}
/* HEADER */
.hdr{padding:env(safe-area-inset-top,14px) 18px 16px;color:#fff;flex-shrink:0;}
.hdr.purple{background:var(--p);}
.hdr.red{background:var(--r);}
.hdr.dark{background:var(--pd);}
.hdr.green{background:var(--gn);}
.hdr-title{font-size:19px;font-weight:800;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;padding-top:6px;}
/* SCROLL */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--gr2);}
.body::-webkit-scrollbar{display:none;}
.pad{padding:14px 16px 100px;}
/* NAVBAR */
.navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gr3);display:flex;justify-content:space-around;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:100;flex-shrink:0;}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 12px;min-width:56px;}
.ni svg{width:24px;height:24px;fill:none;stroke:var(--gr4);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ni span{font-size:10px;font-weight:700;color:var(--gr4);font-family:'Plus Jakarta Sans',sans-serif;}
.ni.on svg{stroke:var(--p);}
.ni.on span{color:var(--p);}
/* CARDS */
.card{background:var(--wh);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.row{display:flex;align-items:center;gap:12px;}
.ibox{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ibox svg{width:22px;height:22px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ct{font-size:14px;font-weight:700;color:var(--gr6);font-family:'Plus Jakarta Sans',sans-serif;}
.cs{font-size:12px;color:var(--gr5);margin-top:2px;}
.dvd{height:1px;background:var(--gr2);margin:12px 0;}
/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap;}
.bp{background:var(--pl);color:var(--p);}
.br{background:var(--r);color:#fff;}
.brs{background:var(--rl);color:var(--r);}
.bg{background:var(--gl);color:var(--gn);}
.bw{background:var(--wl);color:var(--wd);}
.bd{background:var(--pd);color:#fff;}
/* SECTION */
.sec{font-size:11px;font-weight:800;color:var(--p);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;font-family:'Plus Jakarta Sans',sans-serif;}
/* BUTTONS */
.btn{border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Plus Jakarta Sans',sans-serif;padding:12px 16px;transition:opacity .1s;-webkit-appearance:none;}
.btn:active{opacity:.75;}
.btnp{background:var(--p);color:#fff;}
.btnr{background:var(--rl);color:var(--r);}
.btng{background:var(--gl);color:var(--gn);}
.btngh{background:var(--gr2);color:var(--gr5);}
.btnfull{width:100%;padding:15px;}
/* INPUT */
.ig{margin-bottom:16px;}
.il{font-size:11px;font-weight:700;color:var(--p);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif;}
.if{width:100%;padding:14px;border:1.5px solid var(--gr3);border-radius:12px;font-size:15px;color:var(--gr6);background:var(--gr1);font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none;}
/* LIST */
.lr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--gr2);}
.lr:last-child{border:none;}
/* STATS */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.sc{background:var(--wh);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.sn{font-size:26px;font-weight:800;color:var(--p);font-family:'Plus Jakarta Sans',sans-serif;}
.sl{font-size:11px;color:var(--gr5);margin-top:2px;}
/* URGENCE */
.urg{background:var(--r);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer;}
.urg .t{font-size:13px;font-weight:700;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;}
.urg .s{font-size:11px;color:rgba(255,255,255,.85);margin-top:2px;}
/* SEARCH */
.sbar{background:rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-top:10px;}
.sbar input{background:transparent;border:none;outline:none;color:#fff;font-size:14px;flex:1;font-family:'DM Sans',sans-serif;}
.sbar input::placeholder{color:rgba(255,255,255,.6);}
/* FILTER */
.ftabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;}
.ftabs::-webkit-scrollbar{display:none;}
.ft{padding:8px 18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.5);font-size:12px;font-weight:700;color:rgba(255,255,255,.9);cursor:pointer;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif;background:transparent;-webkit-appearance:none;}
.ft.on{background:#fff;border-color:#fff;color:var(--r);}
/* LOGIN */
.lhero{padding:env(safe-area-inset-top,20px) 24px 50px;text-align:center;background:linear-gradient(150deg,var(--p),var(--pd));}
.lhero .lb{width:76px;height:76px;background:#fff;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.lhero .lb svg{width:38px;height:38px;}
.lhero .an{font-size:28px;font-weight:800;color:#fff;letter-spacing:1.5px;font-family:'Plus Jakarta Sans',sans-serif;}
.lhero .at{font-size:10px;color:rgba(255,255,255,.65);letter-spacing:3px;margin-top:6px;}
.lform{flex:1;background:#fff;border-radius:28px 28px 0 0;margin-top:-20px;padding:28px 22px 30px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
/* AVATAR */
.av{width:46px;height:46px;border-radius:23px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.38);font-family:'Plus Jakarta Sans',sans-serif;flex-shrink:0;}
/* CARD ACCENT */
.ca{border-left:3px solid var(--r);border-radius:0 16px 16px 0;}
/* PROFILE */
.phero{background:var(--p);padding:env(safe-area-inset-top,20px) 24px 30px;text-align:center;flex-shrink:0;}
.pav{width:84px;height:84px;border-radius:42px;background:rgba(255,255,255,.2);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;border:3px solid rgba(255,255,255,.35);font-family:'Plus Jakarta Sans',sans-serif;}
.med-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.pharma-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--gr2);}
.pharma-row:last-child{border:none;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* ── ICONS ── */
const I = {
  heart: <svg viewBox="0 0 24 24" fill="#DC2626" stroke="none"><path d="M12 21.6C6.4 16.1 1 11.3 1 7.2 1 3.4 4.1 2 6.3 2c1.3 0 4.2.5 5.7 4.5C13.6 2.5 16.5 2 17.7 2c2.5 0 5.3 1.6 5.3 5.2 0 4.1-5.1 8.6-11 14.4z"/></svg>,
  home: <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
  folder: <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>,
  doc: <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
  pill: <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><line x1="12" y1="6" x2="12" y2="18"/></svg>,
  user: <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
  bell: <svg viewBox="0 0 24 24" stroke="rgba(255,255,255,.85)"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>,
  chev: <svg viewBox="0 0 24 24" stroke="#9CA3AF"><polyline points="9 18 15 12 9 6"/></svg>,
  alert: <svg viewBox="0 0 24 24" stroke="#fff"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
  qr: <svg viewBox="0 0 24 24" stroke="#fff"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><path d="M21 16h-3v3M21 21v.01M16 16v.01M16 21h3"/></svg>,
  search: <svg viewBox="0 0 24 24" stroke="rgba(255,255,255,.7)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  pin: <svg viewBox="0 0 24 24" stroke="#7C3AED"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>,
  eye: <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  share: <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
  spark: <svg viewBox="0 0 24 24" stroke="#fff"><path d="M12 3L9.5 8.5 3 12l6.5 3.5L12 21l2.5-5.5L21 12l-6.5-3.5z"/></svg>,
  logout: <svg viewBox="0 0 24 24" stroke="#DC2626"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>,
  edit: <svg viewBox="0 0 24 24" stroke="#7C3AED"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  cal: <svg viewBox="0 0 24 24" stroke="#7C3AED"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
  phone: <svg viewBox="0 0 24 24" stroke="#7C3AED"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.18 6.18l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>,
  steth: <svg viewBox="0 0 24 24" stroke="#7C3AED"><path d="M4.8 2.3A.3.3 0 105 2H4a2 2 0 00-2 2v5a6 6 0 006 6v0a6 6 0 006-6V4a2 2 0 00-2-2h-1"/><path d="M8 15v1a6 6 0 006 6v0a6 6 0 006-6v-4"/><circle cx="20" cy="10" r="2"/></svg>,
  shield: <svg viewBox="0 0 24 24" stroke="#7C3AED"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
  settings: <svg viewBox="0 0 24 24" stroke="#7C3AED"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>,
  help: <svg viewBox="0 0 24 24" stroke="#7C3AED"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/></svg>,
};

function IC({i,c,s=22}){return <span style={{display:'inline-flex',width:s,height:s,flexShrink:0}}>{i}</span>;}

function NavBar({screen,go}){
  const tabs=[['home','Accueil',I.home],['dossier','Dossier',I.folder],['examens','Examens',I.doc],['medoc','Médocs',I.pill],['profil','Profil',I.user]];
  return <div className="navbar">
    {tabs.map(([id,label,icon])=>{
      const on=screen===id;
      return <div key={id} className={`ni${on?' on':''}`} onClick={()=>go(id)}>
        <span style={{width:24,height:24,display:'flex',opacity:on?1:.5}}>{icon}</span>
        <span>{label}</span>
      </div>;
    })}
  </div>;
}

function Login({onLogin}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const go=()=>{
    if(!email||!pass){alert('Veuillez remplir email et mot de passe');return;}
    onLogin();
  };
  return <div className="screen on" style={{background:'#fff'}}>
    <div className="lhero">
      <div className="lb">{I.heart}</div>
      <div className="an">MARCI-DOC</div>
      <div className="at">VOTRE SANTÉ, NOTRE ENGAGEMENT</div>
    </div>
    <div className="lform">
      <div style={{fontSize:20,fontWeight:800,color:'#1F2937',fontFamily:'Plus Jakarta Sans',marginBottom:24}}>Connexion</div>
      <div className="ig">
        <label className="il">Email / Téléphone</label>
        <input className="if" placeholder="+241 07 XX XX XX" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="off"/>
      </div>
      <div className="ig">
        <label className="il">Mot de passe</label>
        <input className="if" type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)}/>
      </div>
      <div style={{textAlign:'right',marginBottom:24}}>
        <span style={{fontSize:13,color:'#7C3AED',fontWeight:600}}>Mot de passe oublié ?</span>
      </div>
      <button className="btn btnp btnfull" onClick={go}>Se connecter</button>
      <button className="btn btnfull" style={{background:'#fff',color:'#7C3AED',border:'1.5px solid #7C3AED',marginTop:12}} onClick={()=>alert('Inscription à venir')}>Créer un compte</button>
      <div style={{marginTop:20,background:'#FEF2F2',borderRadius:14,padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>
        <IC i={I.qr} s={24}/>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:700,color:'#991B1B',fontFamily:'Plus Jakarta Sans'}}>Accès urgence sans connexion</div>
          <div style={{fontSize:11,color:'#B91C1C',marginTop:2}}>QR Code médical disponible</div>
        </div>
      </div>
    </div>
  </div>;
}

function Home({go}){
  return <div className="screen on">
    <div className="hdr purple">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:32,height:32,background:'#fff',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center'}}><IC i={I.heart} s={18}/></div>
          <span style={{fontSize:15,fontWeight:800,color:'#fff',fontFamily:'Plus Jakarta Sans',letterSpacing:.5}}>MARCI-DOC</span>
        </div>
        <IC i={I.bell} s={24}/>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <div className="av">MA</div>
        <div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.75)'}}>Bonjour,</div>
          <div style={{fontSize:17,fontWeight:800,color:'#fff',fontFamily:'Plus Jakarta Sans'}}>Marcia Abessolo</div>
        </div>
      </div>
    </div>
    <div className="body">
      <div className="pad">
        <div className="urg" onClick={()=>alert('QR Code médical — fonctionnalité d\'urgence')}>
          <IC i={I.alert} s={24}/>
          <div style={{flex:1}}>
            <div className="t">Accès urgence — QR Code médical</div>
            <div className="s">Infos critiques sans connexion</div>
          </div>
          <IC i={I.qr} s={24}/>
        </div>
        <div className="sgrid">
          {[['3','Ordonnances'],['5','Examens'],['2','RDV']].map(([n,l])=>(
            <div className="sc" key={l}><div className="sn">{n}</div><div className="sl">{l}</div></div>
          ))}
        </div>
        <div className="sec">Mes services</div>
        {[
          {bg:'#EDE9FE',ic:I.folder,title:'Dossier médical',sub:'Mis à jour il y a 2 jours',badge:null,s:'dossier'},
          {bg:'#FEF2F2',ic:I.doc,title:"Résultats d'examens",sub:'1 nouveau résultat disponible',badge:'1',s:'examens'},
          {bg:'#ECFDF5',ic:I.pill,title:'Médicaments & Pharmacies',sub:'3 médicaments actifs',badge:null,s:'medoc'},
        ].map(srv=>(
          <div className="card" key={srv.title} style={{cursor:'pointer'}} onClick={()=>go(srv.s)}>
            <div className="row">
              <div className="ibox" style={{background:srv.bg}}><IC i={srv.ic} s={22}/></div>
              <div style={{flex:1}}><div className="ct">{srv.title}</div><div className="cs">{srv.sub}</div></div>
              {srv.badge?<span className="bdg br">{srv.badge}</span>:<IC i={I.chev} s={18}/>}
            </div>
          </div>
        ))}
      </div>
    </div>
    <NavBar screen="home" go={go}/>
  </div>;
}

function Dossier({go}){
  return <div className="screen on">
    <div className="hdr dark">
      <div className="hdr-title">Dossier médical</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginTop:14}}>
        {[['A+','Groupe sanguin'],['68 kg','Poids'],['1m65','Taille']].map(([v,l])=>(
          <div key={l} style={{background:'rgba(255,255,255,.13)',borderRadius:12,padding:'10px 8px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800,color:'#fff',fontFamily:'Plus Jakarta Sans'}}>{v}</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,.7)',marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>
    </div>
    <div className="body">
      <div className="pad">
        <div className="sec">Informations générales</div>
        <div className="card">
          {[[I.cal,'Date de naissance','15 mars 1998 — 27 ans'],[I.phone,'Contact urgence','Jean Abessolo — +241 07 XX XX XX'],[I.steth,'Médecin traitant','Dr. Ondo — Libreville']].map(([ic,l,v])=>(
            <div className="lr" key={l}>
              <IC i={ic} s={18}/>
              <div style={{flex:1}}>
                <div style={{fontSize:12,color:'#6B7280'}}>{l}</div>
                <div style={{fontSize:14,fontWeight:600,color:'#1F2937',marginTop:2,fontFamily:'Plus Jakarta Sans'}}>{v}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="sec">Antécédents & Allergies</div>
        <div className="card">
          {[['allergie','Pénicilline','bw'],['chronique','Hypertension légère','bp'],['chirurgie','Appendicite — 2019','bg'],['vaccination','Hépatite B — 2021','bd']].map(([t,l,bc])=>(
            <div className="lr" key={l}>
              <span className={`bdg ${bc}`}>{t}</span>
              <span style={{fontSize:14,color:'#1F2937'}}>{l}</span>
            </div>
          ))}
        </div>
        <button className="btn btnfull" style={{background:'#fff',color:'#7C3AED',border:'1.5px solid #7C3AED',gap:8}}>
          <IC i={I.edit} s={16}/> Modifier le dossier
        </button>
      </div>
    </div>
    <NavBar screen="dossier" go={go}/>
  </div>;
}

function Examens({go}){
  const [filter,setFilter]=useState('Tous');
  const data=[
    {id:1,titre:'Bilan sanguin complet',labo:'Labo Santé Plus',date:'20 mai 2026',type:'biologie',statut:'nouveau'},
    {id:2,titre:'Radiographie thoracique',labo:'Clinique El Rapha',date:'10 avr. 2026',type:'imagerie',statut:'normal'},
    {id:3,titre:'Glycémie à jeun',labo:'Pharmacie Centrale',date:'2 mars 2026',type:'biologie',statut:'surveiller'},
    {id:4,titre:'Échographie abdominale',labo:'Clinique El Rapha',date:'15 jan. 2026',type:'imagerie',statut:'normal'},
  ];
  const S={nouveau:{bc:'br',label:'Nouveau',acc:true},normal:{bc:'bg',label:'Normal',acc:false},surveiller:{bc:'bw',label:'Surveiller',acc:false}};
  const list=filter==='Tous'?data:data.filter(e=>e.type===filter.toLowerCase());
  return <div className="screen on">
    <div className="hdr red">
      <div className="hdr-title">Résultats d'examens</div>
      <div className="ftabs">
        {['Tous','Biologie','Imagerie'].map(f=><button key={f} className={`ft${filter===f?' on':''}`} onClick={()=>setFilter(f)}>{f}</button>)}
      </div>
    </div>
    <div className="body">
      <div className="pad">
        {list.map(ex=>{
          const s=S[ex.statut];
          return <div key={ex.id} className={`card${s.acc?' ca':''}`} style={{marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div style={{flex:1,paddingRight:10}}><div className="ct">{ex.titre}</div><div className="cs">{ex.labo} — {ex.date}</div></div>
              <span className={`bdg ${s.bc}`}>{s.label}</span>
            </div>
            <div className="dvd"/>
            <div style={{display:'flex',gap:8}}>
              <button className={`btn ${s.acc?'btnr':'btngh'}`} style={{flex:1}} onClick={()=>alert(`Ouverture : ${ex.titre}`)}>
                <IC i={I.eye} s={14}/> Voir
              </button>
              <button className="btn btnp" style={{flex:1}} onClick={()=>alert('Analyse IA — à connecter')}>
                <IC i={I.spark} s={14}/> Analyser
              </button>
              <button className="btn btngh" style={{flex:1}} onClick={()=>alert('Partage en cours...')}>
                <IC i={I.share} s={14}/> Partager
              </button>
            </div>
          </div>;
        })}
      </div>
    </div>
    <NavBar screen="examens" go={go}/>
  </div>;
}

function Medoc({go}){
  const [q,setQ]=useState('');
  const ords=[
    {nom:'Amlodipine 5mg',pos:'1 cp/jour — matin',stock:'ok',dot:'#7C3AED'},
    {nom:'Metformine 500mg',pos:'2 cp/jour — repas',stock:'bientot',dot:'#DC2626'},
    {nom:'Vitamine D3 1000UI',pos:'1 cp/jour — soir',stock:'ok',dot:'#059669'},
  ];
  const phs=[
    {nom:'Pharmacie Centrale',adr:'Bvd Triomphal',dist:'0.8 km',ouvert:true},
    {nom:'Pharmacie de la Sablière',adr:'Av. des Cocotiers',dist:'1.4 km',ouvert:true},
    {nom:'Pharmacie Louis',adr:'Quartier Glass',dist:'2.1 km',ouvert:false},
  ];
  return <div className="screen on">
    <div className="hdr green">
      <div className="hdr-title">Médicaments</div>
      <div className="sbar">
        <IC i={I.search} s={18}/>
        <input placeholder="Rechercher un médicament..." value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
    </div>
    <div className="body">
      <div className="pad">
        <div className="sec">Ordonnances actives</div>
        <div className="card">
          {ords.map((o,i)=>(
            <div className="lr" key={i}>
              <div className="med-dot" style={{background:o.dot}}/>
              <div style={{flex:1}}><div className="ct">{o.nom}</div><div className="cs">{o.pos}</div></div>
              <span className={`bdg ${o.stock==='ok'?'bg':'bw'}`}>{o.stock==='ok'?'Stock OK':'Bientôt épuisé'}</span>
            </div>
          ))}
        </div>
        <div className="sec">Pharmacies proches — Libreville</div>
        <div className="card">
          {phs.map((p,i)=>(
            <div className="pharma-row" key={i}>
              <IC i={I.pin} s={18}/>
              <div style={{flex:1}}><div className="ct">{p.nom}</div><div className="cs">{p.adr} — {p.dist}</div></div>
              <span className={`bdg ${p.ouvert?'bg':'brs'}`}>{p.ouvert?'Ouvert':'Fermé'}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
    <NavBar screen="medoc" go={go}/>
  </div>;
}

function Profil({go,onLogout}){
  const items=[[I.user,'Informations personnelles'],[I.shield,'Confidentialité & Sécurité'],[I.bell,'Notifications'],[I.settings,'Paramètres'],[I.help,'Aide & Support']];
  return <div className="screen on">
    <div className="phero">
      <div className="pav">MA</div>
      <div style={{fontSize:19,fontWeight:800,color:'#fff',fontFamily:'Plus Jakarta Sans'}}>Marcia Abessolo</div>
      <div style={{fontSize:13,color:'rgba(255,255,255,.75)',marginTop:4}}>marcia@email.com</div>
    </div>
    <div className="body">
      <div className="pad">
        <div className="card" style={{padding:'4px 14px'}}>
          {items.map(([ic,l])=>(
            <div className="lr" key={l} style={{cursor:'pointer'}}>
              <IC i={ic} s={20}/>
              <span style={{flex:1,fontSize:14,fontWeight:600,color:'#1F2937',fontFamily:'Plus Jakarta Sans'}}>{l}</span>
              <IC i={I.chev} s={16}/>
            </div>
          ))}
        </div>
        <button className="btn btnfull" style={{background:'#FEF2F2',color:'#DC2626',border:'none',gap:8,marginTop:0}} onClick={onLogout}>
          <IC i={I.logout} s={18}/> Se déconnecter
        </button>
      </div>
    </div>
    <NavBar screen="profil" go={go}/>
  </div>;
}

function App(){
  const [logged,setLogged]=useState(false);
  const [screen,setScreen]=useState('home');
  if(!logged) return <Login onLogin={()=>setLogged(true)}/>;
  return <>
    {screen==='home'&&<Home go={setScreen}/>}
    {screen==='dossier'&&<Dossier go={setScreen}/>}
    {screen==='examens'&&<Examens go={setScreen}/>}
    {screen==='medoc'&&<Medoc go={setScreen}/>}
    {screen==='profil'&&<Profil go={setScreen} onLogout={()=>{setLogged(false);setScreen('home');}}/>}
  </>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
